apiVersion: v1
kind: ServiceAccount
metadata: {name: k8s-inventory-collector, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: k8s-inventory-collector}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: k8s-inventory-collector}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: k8s-inventory-collector}
subjects:
  - {kind: ServiceAccount, name: k8s-inventory-collector, namespace: monitoring}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-inventory-collector
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: k8s-inventory-collector}}
  template:
    metadata: {labels: {app: k8s-inventory-collector}}
    spec:
      serviceAccountName: k8s-inventory-collector
      tolerations: [{operator: Exists}]
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: collector
          image: python:3.12-slim
          command: ["python", "-u", "/app/collector.py"]
          env:
            - {name: CH_URL, value: "http://chi-eks-test-cluster-0-0.monitoring.svc.cluster.local:8123"}
            - {name: CH_USER, value: admin}
            - name: CH_PASSWORD
              valueFrom: {secretKeyRef: {name: clickhouse-credentials, key: ingest_password}}
            - {name: PROM_URL, value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"}
            - {name: INTERVAL_SECONDS, value: "60"}
            - {name: DEDICATED_LABEL_KEYS, value: "dedicated,workload-type"}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts: [{name: script, mountPath: /app}]
      volumes:
        - name: script
          configMap: {name: k8s-inventory-script}
