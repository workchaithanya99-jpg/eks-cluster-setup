cat clickhouse-installation.yaml
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: eks-test
  namespace: monitoring
spec:
  configuration:
    files:
      config.d/zz-allow-feature-tier.xml: |
        <clickhouse>
          <allow_feature_tier>0</allow_feature_tier>
        </clickhouse>
      config.d/zz-prometheus-handler.xml: |
        <clickhouse>
          <http_handlers>
            <rule>
              <url_prefix>/prometheus/api/v1</url_prefix>
              <handler>
                <type>prometheus_api_v1</type>
              </handler>
            </rule>
            <defaults/>
          </http_handlers>
        </clickhouse>
      users.d/admin.xml: |
        <clickhouse>
          <users>
            <admin>
              <password_sha256_hex>eda15ce4834ac303532bc6973df5ff8a5deb75d7dfceb9fc2cdf1bb450a01cf5</password_sha256_hex>
              <networks>
                <ip>0.0.0.0/0</ip>
                <ip>::/0</ip>
              </networks>
              <profile>default</profile>
              <quota>default</quota>
              <access_management>1</access_management>
            </admin>
          </users>
        </clickhouse>
      users.d/zz-admin-profile.xml: |
        <clickhouse>
          <profiles>
            <admin_profile>
              <enable_time_series_table>1</enable_time_series_table>
            </admin_profile>
          </profiles>
        </clickhouse>
    clusters:
      - name: cluster
        layout:
          shardsCount: 1
          replicasCount: 1
        templates:
          clusterServiceTemplate: clickhouse-lb-template
          podTemplate: clickhouse-persistent-pod
  templates:
    podTemplates:
      - name: clickhouse-persistent-pod
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.9
              volumeMounts:
                - name: clickhouse-storage
                  mountPath: /var/lib/clickhouse
    volumeClaimTemplates:
      - name: clickhouse-storage
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: gp2
          resources:
            requests:
              storage: 20Gi
    serviceTemplates:
      - name: clickhouse-lb-template
        generateName: "clickhouse-{chi}-lb"
        spec:
          type: LoadBalancer
          ports:
            - name: http
              port: 8123
              targetPort: 8123
            - name: tcp
              port: 9000
              targetPort: 9000
